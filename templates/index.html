<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #chat-box { border: 1px solid #ccc; border-radius: 8px; padding: 16px; height: 400px; overflow-y: auto; margin-bottom: 16px; }
        .msg { margin: 8px 0; }
        .user { text-align: right; color: #333; }
        .bot { text-align: left; color: #0066cc; }
        .label { font-weight: bold; margin-right: 4px; }
        form { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <select id="model-select"></select>
    <div id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="message-input" placeholder="메시지를 입력하세요" required>
        <button type="submit">전송</button>
    </form>

    <script>
        async function loadModels() {
            const res = await fetch("/models");
            const data = await res.json();
            const select = document.getElementById("model-select");
            data.models.forEach((name) => {
                const opt = document.createElement("option");
                opt.value = name;
                opt.textContent = name;
                select.appendChild(opt);
            });
        }
        loadModels();

        const form = document.getElementById("chat-form");
        const input = document.getElementById("message-input");
        const chatBox = document.getElementById("chat-box");
        const submitButton = form.querySelector("button[type='submit']");

        function appendMessage(text, sender) {
            const div = document.createElement("div");
            div.className = `msg ${sender}`;

            const label = document.createElement("span");
            label.className = "label";
            label.textContent = sender === "user" ? "나:" : "모델:";

            const textSpan = document.createElement("span");
            textSpan.textContent = text;

            div.appendChild(label);
            div.appendChild(textSpan);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            return textSpan; // 나중에 내용만 갱신할 수 있도록 텍스트 노드 반환
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            appendMessage(message, "user");
            input.value = "";
            input.disabled = true;
            submitButton.disabled = true;
            submitButton.textContent = "전송 중...";

            const thinkingText = appendMessage("생각하는 중...", "bot");
            thinkingText.style.opacity = "0.5";

            const formData = new FormData();
            formData.append("message", message);
            formData.append("model", document.getElementById("model-select").value);

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    body: formData,
                });
                const data = await res.json();
                thinkingText.textContent = data.reply ?? JSON.stringify(data);
                thinkingText.style.opacity = "1";
            } catch (err) {
                thinkingText.textContent = "오류가 발생했습니다: " + err;
                thinkingText.style.opacity = "1";
            } finally {
                input.disabled = false;
                submitButton.disabled = false;
                submitButton.textContent = "전송";
                input.focus();
            }
        });
    </script>
</body>
</html>
