# docker compose up 하나로 앱을 띄운다.
# Ollama 는 호스트(윈도우)에서 GPU 로 돌고 있어야 한다 — 이 compose 는 앱만 감싼다.

services:
  app:
    build: .
    ports:
      - "8000:8000"          # 브라우저는 http://localhost:8000 으로 접속
    environment:
      # 컨테이너 → 호스트의 Ollama. 이 한 줄이 "컨테이너 안 localhost 문제"를 푼다.
      OLLAMA_HOST: http://host.docker.internal:11434
      DATABASE_URL: sqlite:////app/data/chat.db
    volumes:
      # 대화 기록을 호스트에 영속화. 컨테이너를 지워도 chat.db 는 남는다.
      - ./data:/app/data
      # 시스템 프롬프트를 이미지 재빌드 없이 호스트에서 수정 가능하게.
      - ./prompts:/app/prompts:ro
    extra_hosts:
      # 리눅스 호스트에서도 host.docker.internal 이 동작하게 한다.
      # (Docker Desktop(윈도우/맥)은 자동 제공하지만, 명시해두면 리눅스에서도 안전.)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
